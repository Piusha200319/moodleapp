workflows:
  ios-build:
    name: Edu Tech iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 24
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Node Dependencies
        script: |
          npm install --legacy-peer-deps
          npm install --no-save webpack@5.110.3
          npm run prod --prefix cordova-plugin-moodleapp
      - name: Build Web Application
        script: |
          npm run build:prod
      - name: Setup Cordova iOS Platform
        script: |
          npx cordova platform add ios --save || true
          npx cordova plugin add ./cordova-plugin-moodleapp --save || true
          npx cordova prepare ios
      - name: Install CocoaPods
        script: |
          cd platforms/ios
          if [ -f "Podfile" ]; then
            pod install --repo-update || true
          fi
      - name: Build iOS Application
        script: |
          cd platforms/ios
          echo "Current directory contents:"
          ls -la
          
          if [ -d "App.xcworkspace" ]; then
            echo "Building App.xcworkspace..."
            xcodebuild clean build \
              -workspace "App.xcworkspace" \
              -scheme "App" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_ENTITLEMENTS=""
          elif [ -d "App.xcodeproj" ]; then
            echo "Building App.xcodeproj..."
            xcodebuild clean build \
              -project "App.xcodeproj" \
              -scheme "App" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_ENTITLEMENTS=""
          else
            echo "Looking for any workspace or project..."
            WS=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
            PRJ=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
            if [ -n "$WS" ]; then
              xcodebuild clean build -workspace "$WS" -scheme "App" -configuration Release -destination "generic/platform=iOS" -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS=""
            elif [ -n "$PRJ" ]; then
              xcodebuild clean build -project "$PRJ" -scheme "App" -configuration Release -destination "generic/platform=iOS" -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS=""
            fi
          fi
      - name: Package Unsigned IPA
        script: |
          mkdir -p build/ipa/Payload
          APP_PATH=$(find platforms/ios/build/Build/Products -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          
          if [ -n "$APP_PATH" ]; then
            echo "Found app bundle at: $APP_PATH"
            cp -r "$APP_PATH" build/ipa/Payload/
            cd build/ipa
            zip -qr ../../EduTech.ipa Payload
            cd ../..
            echo "IPA created successfully: EduTech.ipa"
            ls -lh EduTech.ipa
          else
            echo "Error: App bundle (*.app) not found."
            find platforms/ios -name "*.app"
            exit 1
          fi
    artifacts:
      - "*.ipa"
      - platforms/ios/build/Build/Products/**/*.app
