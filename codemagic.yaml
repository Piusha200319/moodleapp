workflows:
  ios-build:
    name: Edu Tech iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 24
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Node Dependencies
        script: |
          npm install --legacy-peer-deps
          npm install --no-save webpack@5.110.3
          npm run prod --prefix cordova-plugin-moodleapp
      - name: Build Web Application
        script: |
          npm run build:prod
      - name: Setup Cordova iOS Platform
        script: |
          npx cordova platform add ios --save || true
          npx cordova plugin add ./cordova-plugin-moodleapp --save || true
          npx cordova prepare ios
      - name: Install CocoaPods
        script: |
          cd platforms/ios
          if [ -f "Podfile" ]; then
            pod install --repo-update || true
          fi
      - name: Build iOS Application
        script: |
          cd platforms/ios
          if [ -d "Edu Tech.xcworkspace" ]; then
            xcodebuild clean build \
              -workspace "Edu Tech.xcworkspace" \
              -scheme "Edu Tech" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_ENTITLEMENTS=""
          else
            xcodebuild clean build \
              -project "Edu Tech.xcodeproj" \
              -scheme "Edu Tech" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_ENTITLEMENTS=""
          fi
      - name: Package Unsigned IPA
        script: |
          mkdir -p build/ipa/Payload
          APP_PATH=$(find platforms/ios/build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Found app bundle at: $APP_PATH"
            cp -r "$APP_PATH" build/ipa/Payload/
            cd build/ipa
            zip -qr ../../EduTech.ipa Payload
            cd ../..
            echo "IPA created successfully: EduTech.ipa"
          else
            echo "App bundle not found in release products."
            find platforms/ios/build -name "*.app"
            exit 1
          fi
    artifacts:
      - "*.ipa"
      - platforms/ios/build/Build/Products/Release-iphoneos/*.app
