workflows:
  ios-build:
    name: Edu Tech iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 24
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Node Dependencies
        script: |
          npm install --legacy-peer-deps
          npm install --no-save webpack@5.110.3
          npm run prod --prefix cordova-plugin-moodleapp
      - name: Build Web Application
        script: |
          npm run build:prod
      - name: Setup Cordova iOS Platform
        script: |
          npx cordova platform add ios --save || true
          npx cordova plugin add ./cordova-plugin-moodleapp --save || true
          npx cordova prepare ios
          # Patch private header netinet6/in6.h for Xcode 16 compatibility
          find platforms/ios -type f \( -name "*.m" -o -name "*.h" \) -exec sed -i '' '/#import <netinet6\/in6.h>/d' {} + 2>/dev/null || true
      - name: Install CocoaPods
        script: |
          cd platforms/ios
          if [ -f "Podfile" ]; then
            if ! grep -q "post_install" Podfile; then
              cat << 'EOF' >> Podfile

post_install do |installer|
  installer.pods_project.targets.each do |target|
    target.build_configurations.each do |config|
      config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
    end
  end
end
EOF
            fi
            pod install --repo-update || true
          fi
      - name: Build iOS Application
        script: |
          cd platforms/ios
          # Ensure netinet6/in6.h is stripped from all source and pod files
          find . -type f \( -name "*.m" -o -name "*.h" \) -exec sed -i '' '/#import <netinet6\/in6.h>/d' {} + 2>/dev/null || true
          
          if [ -d "App.xcworkspace" ]; then
            echo "Building App.xcworkspace..."
            xcodebuild clean build \
              -workspace "App.xcworkspace" \
              -scheme "App" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_ENTITLEMENTS=""
          elif [ -d "App.xcodeproj" ]; then
            echo "Building App.xcodeproj..."
            xcodebuild clean build \
              -project "App.xcodeproj" \
              -scheme "App" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_ENTITLEMENTS=""
          fi
      - name: Package Unsigned IPA
        script: |
          mkdir -p build/ipa/Payload
          APP_PATH=$(find platforms/ios/build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          
          if [ -n "$APP_PATH" ]; then
            echo "Found app bundle at: $APP_PATH"
            cp -r "$APP_PATH" build/ipa/Payload/
            cd build/ipa
            zip -qr ../../EduTech.ipa Payload
            cd ../..
            echo "IPA created successfully: EduTech.ipa"
            ls -lh EduTech.ipa
          else
            echo "Error: App bundle (*.app) not found."
            find platforms/ios -name "*.app"
            exit 1
          fi
    artifacts:
      - "*.ipa"
      - platforms/ios/build/**/*.app
